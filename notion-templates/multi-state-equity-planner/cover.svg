<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0c1d3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background stack -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- subtle inner border to feel like a card -->
  <rect x="32" y="32" width="1216" height="656" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- accent bar + brand kicker -->
  <rect x="80" y="92" width="72" height="6" fill="#fbbf24" rx="3"/>
  <text x="80" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="700" fill="#ffffff" letter-spacing="3.4">MATHSTUB · NOTION</text>

  <!-- price badge (top-right) -->
  <g transform="translate(1042, 90)">
    <rect width="158" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <text x="79" y="36" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="24" font-weight="700" fill="#ffffff">$79</text>
  </g>

  <!-- category badge -->
  <g transform="translate(80, 188)">
    <rect width="150.5" height="34" rx="17" fill="rgba(251,191,36,0.16)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
    <text x="75.25" y="22" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.2" fill="#fbbf24">MULTI-STATE</text>
  </g>

  <!-- kicker -->
  <text x="80" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="500" fill="rgba(255,255,255,0.78)">Work-source allocation · NY convenience rule · move ROI</text>

  <!-- title (big) -->
  <text x="80" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="78" font-weight="800" fill="#ffffff" filter="url(#softShadow)">
    <tspan x="80" dy="0">Multi-State Equity</tspan><tspan x="80" dy="92">Comp Tax Planner</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24" font-weight="400" fill="rgba(255,255,255,0.78)">
    <tspan x="80" dy="0">For tech workers who moved CA→TX (or NY→FL) mid-vest. State by</tspan><tspan x="80" dy="34">state.</tspan>
  </text>

  <!-- decorative chart -->
  <g transform="translate(880, 390)" opacity="0.92">
    <path d="M0 200 L40 168 L80 180 L120 122 L160 138 L200 78 L240 64 L280 22"
          stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
    <circle cx="280" cy="22" r="11" fill="#34d399"/>
    <circle cx="280" cy="22" r="22" fill="#34d399" fill-opacity="0.25"/>
  </g>

  <!-- footer mark -->
  <text x="80" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="0.6">mathstub.com · indie tax tools for tech workers</text>
</svg>