<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" font-family="Inter, system-ui, -apple-system, &#39;Segoe UI&#39;, sans-serif">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"></path>
    </marker>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f1f5f9" flood-opacity="0.06"></feDropShadow>
    </filter>
  </defs>
<rect width="1100" height="340" fill="#0f172a"></rect>
<text x="50" y="40" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="2.4">MATHSTUB · SHOW THE MATH</text>
<text x="1050" y="40" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1.4">06 OF 08</text>
<line x1="50" y1="54" x2="1050" y2="54" stroke="#1f2937" stroke-width="1"></line>
<text x="50" y="84" font-size="32" font-weight="700" fill="#f1f5f9">Quarterly Estimated Tax · Safe Harbor</text>
<text x="50" y="106" font-size="16" font-weight="400" fill="#94a3b8">Pre-pay enough each quarter and the underpayment penalty disappears.</text>
<rect x="50" y="120" width="227.5" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<text x="66" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">INPUT · PRIOR YEAR</text>
<text x="66" y="186" font-size="18" font-weight="600" fill="#f1f5f9">Prior-year</text>
<text x="66" y="208" font-size="18" font-weight="600" fill="#f1f5f9">liability</text>
<text x="66" y="252" font-size="14" font-weight="400" fill="#94a3b8">Form 1040 · line 24</text>
<line x1="280.5" y1="204" x2="304.5" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="307.5" y="120" width="227.5" height="168" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#boxShadow)"></rect>
<text x="323.5" y="146" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1.6">STEP 1 · SAFE HARBOR</text>
<text x="323.5" y="186" font-size="16" font-weight="600" fill="#f1f5f9">last year × 100%</text>
<text x="323.5" y="208" font-size="16" font-weight="600" fill="#f1f5f9">× 110% if HCE</text>
<text x="323.5" y="252" font-size="14" font-weight="400" fill="#94a3b8">Pay across the year</text>
<text x="323.5" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §6654(d)(1)(B)</text>
<line x1="538" y1="204" x2="562" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="565" y="120" width="227.5" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="565" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="581" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 2 · QUARTERLY</text>
<text x="581" y="186" font-size="18" font-weight="600" fill="#f1f5f9">÷ 4 quarters</text>
<text x="581" y="252" font-size="14" font-weight="400" fill="#94a3b8">Apr 15 · Jun 15 · Sep 15 · Jan 15</text>
<text x="581" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §6654(c)</text>
<line x1="795.5" y1="204" x2="819.5" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="822.5" y="120" width="227.5" height="168" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#boxShadow)"></rect>
<text x="838.5" y="146" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1.6">PENALTY AVOIDED</text>
<text x="838.5" y="186" font-size="18" font-weight="600" fill="#bbf7d0">No §6654</text>
<text x="838.5" y="208" font-size="18" font-weight="600" fill="#bbf7d0">underpayment</text>
<text x="838.5" y="252" font-size="14" font-weight="400" fill="#94a3b8">Safe-harbor met</text>
<text x="838.5" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §6654(d)</text>
<line x1="50" y1="476" x2="1050" y2="476" stroke="#1f2937" stroke-width="1"></line>
<text x="50" y="316" font-size="14" fill="#94a3b8">Citations refer to the Internal Revenue Code (Title 26 U.S.C.). Educational reference — not tax advice.</text>
<text x="1050" y="316" font-size="14" font-weight="600" fill="#2563eb" text-anchor="end">mathstub.app</text>
</svg>