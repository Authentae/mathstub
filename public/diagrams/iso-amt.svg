<rect x="256" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="256" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="272" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 1 · ADD TO AMTI</text>
<text x="272" y="186" font-size="18" font-weight="600" fill="#f1f5f9">add to AMTI</text>
<text x="272" y="252" font-size="14" font-weight="400" fill="#94a3b8">Preference item</text>
<text x="272" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §56(b)(3)</text>
<line x1="435" y1="204" x2="459" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="462" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="462" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="478" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 2 · EXEMPTION</text>
<text x="478" y="186" font-size="18" font-weight="600" fill="#f1f5f9">− exemption</text>
<text x="478" y="252" font-size="14" font-weight="400" fill="#94a3b8">Phases out at high AMTI</text>
<text x="478" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §55(d)</text>
<line x1="641" y1="204" x2="665" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="668" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="668" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="684" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 3 · TENTATIVE</text>
<text x="684" y="186" font-size="16" font-weight="600" fill="#f1f5f9">26%  · first $232.6K</text>
<text x="684" y="208" font-size="16" font-weight="600" fill="#f1f5f9">28%  · excess</text>
<text x="684" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §55(b)</text>
<line x1="847" y1="204" x2="871" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>
<rect x="874" y="120" width="176" height="168" rx="10" fill="#3f0a0a" stroke="#dc2626" stroke-width="2" filter="url(#boxShadow)"></rect>
<text x="890" y="146" font-size="13" font-weight="700" fill="#dc2626" letter-spacing="1.6">AMT OWED · F 6251</text>
<text x="890" y="186" font-size="18" font-weight="600" fill="#fca5a5">higher of AMT</text>
<text x="890" y="208" font-size="18" font-weight="600" fill="#fca5a5">or regular</text>
<text x="890" y="252" font-size="14" font-weight="400" fill="#94a3b8">Pay the higher of the two</text>
<text x="890" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §55(a)</text>
<line x1="50" y1="476" x2="1050" y2="476" stroke="#1f2937" stroke-width="1"></line>
