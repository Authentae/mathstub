<line x1="50" y1="54" x2="1050" y2="54" stroke="#1f2937" stroke-width="1"></line>
<text x="50" y="84" font-size="32" font-weight="700" fill="#f1f5f9">ISO Exercise → AMT Liability</text>
<text x="50" y="106" font-size="16" font-weight="400" fill="#94a3b8">How an ISO exercise quietly triggers Alternative Minimum Tax even with $0 sold.</text>
