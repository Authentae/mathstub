<text x="66" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">INPUT · BARGAIN</text>
<text x="66" y="186" font-size="18" font-weight="600" fill="#f1f5f9">(FMV − strike)</text>
<text x="66" y="208" font-size="18" font-weight="600" fill="#f1f5f9">× shares</text>
<text x="66" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §422</text>
