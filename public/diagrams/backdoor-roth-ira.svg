  </defs>
<rect width="1100" height="340" fill="#0f172a"></rect>
<text x="50" y="40" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="2.4">MATHSTUB · SHOW THE MATH</text>
<text x="1050" y="40" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1.4">10 OF 10</text>
<line x1="50" y1="54" x2="1050" y2="54" stroke="#1f2937" stroke-width="1"></line>
<text x="50" y="84" font-size="32" font-weight="700" fill="#f1f5f9">Backdoor Roth IRA → pro-rata blends all your Trad IRAs</text>
<text x="50" y="106" font-size="16" font-weight="400" fill="#94a3b8">Non-deductible Trad contribution + immediate conversion = Roth IRA access for high earners.</text>

<rect x="50" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<text x="66" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">INPUT · CONTRIB</text>
<text x="66" y="186" font-size="18" font-weight="600" fill="#f1f5f9">$7,500</text>
<text x="66" y="208" font-size="18" font-weight="600" fill="#f1f5f9">non-deductible</text>
<text x="66" y="252" font-size="14" font-weight="400" fill="#94a3b8">After-tax basis</text>
<text x="66" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §219</text>

<line x1="229" y1="204" x2="253" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>

<rect x="256" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="256" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="272" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 1 · POOL</text>
<text x="272" y="186" font-size="18" font-weight="600" fill="#f1f5f9">+ pre-tax</text>
<text x="272" y="208" font-size="18" font-weight="600" fill="#f1f5f9">Trad IRA</text>
<text x="272" y="252" font-size="14" font-weight="400" fill="#94a3b8">All IRAs aggregated</text>
<text x="272" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §408(d)(2)</text>

<line x1="435" y1="204" x2="459" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>

<rect x="462" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="462" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="478" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 2 · PRO-RATA</text>
<text x="478" y="186" font-size="18" font-weight="600" fill="#f1f5f9">pre-tax</text>
<text x="478" y="208" font-size="18" font-weight="600" fill="#f1f5f9">÷ total</text>
<text x="478" y="252" font-size="14" font-weight="400" fill="#94a3b8">= taxable %</text>
<text x="478" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">Form 8606</text>

<line x1="641" y1="204" x2="665" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>

<rect x="668" y="120" width="176" height="168" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.4" filter="url(#boxShadow)"></rect>
<rect x="668" y="132" width="3" height="20" rx="1.5" fill="#2563eb"></rect>
<text x="684" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1.6">STEP 3 · CONVERT</text>
<text x="684" y="186" font-size="18" font-weight="600" fill="#f1f5f9">Trad → Roth</text>
<text x="684" y="208" font-size="18" font-weight="600" fill="#f1f5f9">tax owed</text>
<text x="684" y="252" font-size="14" font-weight="400" fill="#94a3b8">% × bal × rate</text>
<text x="684" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">IRC §408A</text>

<line x1="847" y1="204" x2="871" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"></line>

<rect x="874" y="120" width="176" height="168" rx="10" fill="#0f2a1a" stroke="#16a34a" stroke-width="2" filter="url(#boxShadow)"></rect>
<text x="890" y="146" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1.2">ROTH IRA</text>
<text x="890" y="186" font-size="18" font-weight="600" fill="#bbf7d0">tax-free</text>
<text x="890" y="208" font-size="18" font-weight="600" fill="#bbf7d0">growth</text>
<text x="890" y="252" font-size="14" font-weight="400" fill="#94a3b8">Qualified after 59½</text>
<text x="890" y="272" font-size="14" font-style="italic" font-weight="500" fill="#94a3b8">+ 5-year clock</text>

<line x1="50" y1="476" x2="1050" y2="476" stroke="#1f2937" stroke-width="1"></line>
<text x="50" y="316" font-size="14" fill="#94a3b8">Escape pro-rata: roll pre-tax Trad IRA into 401(k) BEFORE Dec 31 of conversion year. Not tax advice.</text>
<text x="1050" y="316" font-size="14" font-weight="600" fill="#2563eb" text-anchor="end">mathstub.app</text>
</svg>
